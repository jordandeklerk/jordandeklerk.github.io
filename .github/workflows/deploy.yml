name: Deploy site

# Refreshes the GitHub numbers (assets/data/github.json) and publishes the site.
# Runs when main changes, every six hours, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refresh the GitHub numbers
        # If GitHub's API cannot be reached, publish with the numbers already in the repo.
        continue-on-error: true
        env:
          # Optional personal access token; the built-in token is used when it is not set.
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_github_data.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
